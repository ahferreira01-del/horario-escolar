# Release candidate self-hosted — NOT authorized to deploy until production gates pass.
# The default docker-compose.yml is strictly for local development.
# A fresh volume is required for docker/db-init/10-runtime-role.sh.
name: horario-inteligente
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: horario
      POSTGRES_USER: horario_owner
      POSTGRES_PASSWORD: ${HI_POSTGRES_OWNER_PASSWORD:?Configure senha forte do OWNER}
      RUNTIME_DB_PASSWORD: ${HI_POSTGRES_RUNTIME_PASSWORD:?Configure senha diferente do RUNTIME}
    volumes:
      - horario_prod_pgdata:/var/lib/postgresql/data
      - ./docker/db-init/10-runtime-role.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
    networks: [data_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horario_owner -d horario"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
  migrate:
    profiles: ["maintenance"]
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${HI_DB_OWNER_URL:?Owner migration-only URL}
      ENVIRONMENT: development
    networks: [data_net]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${HI_REDIS_PASSWORD:?Set Redis authentication secret}
    command: ["sh", "-ec", "exec redis-server --save '' --appendonly no --requirepass \"$REDIS_PASSWORD\""]
    networks: [data_net]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${HI_DB_RUNTIME_URL:?Runtime-only URL}
      AUTH_RATE_LIMIT_REDIS_URL: ${HI_AUTH_REDIS_URL:?Set Redis URL with password}
      SESSION_SECRET: ${HI_SESSION_SECRET:?Set unique session secret}
      COOKIE_SECURE: "true"
      PUBLIC_APP_URL: https://${HI_PUBLIC_HOST:?Set public DNS host}
      SESSION_MAX_MINUTES: ${HI_SESSION_MAX_MINUTES:-120}
      SMTP_HOST: ${HI_SMTP_HOST:?Set SMTP service}
      SMTP_PORT: ${HI_SMTP_PORT:-587}
      SMTP_USER: ${HI_SMTP_USER:-}
      SMTP_PASSWORD: ${HI_SMTP_PASSWORD:-}
      SMTP_FROM: ${HI_SMTP_FROM:?Set sender}
    networks: [data_net, service_net]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 20s
      timeout: 6s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
  web:
    build:
      context: ./frontend
      args:
        API_BACKEND_URL: http://api:8000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    networks: [service_net, edge_net]
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      HI_PUBLIC_HOST: ${HI_PUBLIC_HOST:?Set public DNS host}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - horario_prod_caddy_data:/data
      - horario_prod_caddy_config:/config
    networks: [edge_net]
    depends_on: [web]
    security_opt:
      - no-new-privileges:true
networks:
  data_net:
    internal: false  # API needs SMTP egress. Never expose service ports externally.
  service_net:
    internal: false
  edge_net:
    internal: false
volumes:
  horario_prod_pgdata:
  horario_prod_caddy_data:
  horario_prod_caddy_config:
